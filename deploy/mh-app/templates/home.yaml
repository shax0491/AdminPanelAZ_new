# mihomo на роутере (Netcraze Ultra). Устройства из /opt/etc/mihomo/tproxy-clients: TCP и DNS перехватываются в mihomo
# (nat REDIRECT, /opt/etc/ndm/netfilter.d/90-mihomo.sh). Серверы - ваши AntiZapret по AWG3 (клиент AT_Router_mihomo).
# YouTube - через «Авто». Карточки: по умолчанию «Авто — самый быстрый» (url-test раз в 30 мин, lazy), страну можно закрепить. Чтобы не держать из дома
# 4 VPN-туннеля разом: без persistent-keepalive (туннель поднимается при трафике), проверка серверов раз в 30 мин и
# только у используемых групп (lazy).
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
# меньше нагрузки на роутер: не искать процесс на каждое соединение; keepalive держит туннели без мёртвых соединений
find-process-mode: "off"
keep-alive-idle: 600
keep-alive-interval: 30
geodata-loader: memconservative
external-controller: 0.0.0.0:9090
external-ui: ui
# панель zashboard (без этой строки mihomo при обновлении панели скачивает MetaCubeXD)
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: "REDACTED"
profile: {store-selected: true}
geodata-mode: true
geox-url:
  geoip: "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat"
geo-auto-update: true
geo-update-interval: 24
tun: {enable: false}
sniffer:
  enable: true
  override-destination: false
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880]}
    QUIC: {ports: [443]}
  # чужие MTProxy (fake-TLS с доменом-маской): сниффер подменил бы адрес прокси на домен маски
  skip-dst-address: [213.155.28.3/32]
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  cache-algorithm: arc
  use-hosts: true
  # redir-host: устройствам отдаются настоящие адреса (UDP, звонки, игры работают как обычно), а mihomo помнит домен
  enhanced-mode: normal
  # как у AntiZapret: обычные сайты - российский DNS напрямую (адреса, которые работают из РФ: они и идут напрямую),
  # заблокированное и всё, что идёт через VPN, - Cloudflare через «Авто» (зарубежные адреса, без утечки DNS)
  default-nameserver: [62.76.76.62, 62.76.62.76]
  nameserver: [77.88.8.8, 77.88.8.1]
  proxy-server-nameserver: [62.76.76.62, 62.76.62.76]
  nameserver-policy:
    "+.ru,+.su,+.рф,geosite:category-ru,geosite:ru-available-only-inside": [62.76.76.62, 62.76.62.76, 77.88.8.8]
    # YouTube - настоящие адреса у MSK-IX: адрес нужен только для доменных правил, сам трафик идёт через VPN
    "+.youtube.com,+.googlevideo.com,+.ytimg.com,+.ggpht.com,+.youtu.be,+.youtube-nocookie.com,+.youtubekids.com,+.google.ru": [62.76.76.62, 62.76.62.76]
    "rule-set:az-include,az-full,ru-blocked,my-vpn": ["1.1.1.1#Авто — самый быстрый"]
    "geosite:ru-blocked,refilter,antifilter-download-community,openai,anthropic,category-ai-!cn,telegram,discord,instagram,facebook,twitter,whatsapp,tiktok,netflix,spotify,twitch,google,category-porn": ["1.1.1.1#Авто — самый быстрый"]
