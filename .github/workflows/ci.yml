name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check backend/ --output-format=github

      - name: Python compile check
        run: python -m compileall -q backend/app backend/node_agent

      - name: Import smoke test (panel + node agent)
        working-directory: backend
        env:
          NODE_AGENT_MODE: dev
        run: |
          PYTHONPATH=. python -c "from app.main import app; print('panel app import ok')"
          PYTHONPATH=. python -c "from node_agent.main import app as agent_app; print('node agent import ok')"

      - name: Pytest
        working-directory: backend
        env:
          NODE_AGENT_MODE: dev
        run: PYTHONPATH=. pytest tests/ -q --tb=short

      # PYSEC-2026-4146 (PyJWT): no fixed release; only hits decode with verify_signature=False, unused here.
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-4146

      - name: Bandit (security scan)
        run: bandit -c backend/bandit.yaml -r backend/app backend/node_agent -ll

  frontend:
    name: frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend (panel + tg-mini)
        working-directory: frontend
        run: npm run build:all

      - name: Charts stay out of the initial bundle
        working-directory: frontend
        run: npm run check:bundle

      - name: npm audit
        working-directory: frontend
        # GHSA-vfj7-8cjw-p6xm (braces, pulled in by tailwindcss's dev-only file
        # watcher) has no patched version as of this writing — the only "fix"
        # npm offers is a major tailwindcss v4 bump. braces here never runs
        # against untrusted input (local source files only, build-time), so
        # fail only if a *new*, non-allowlisted high/critical advisory shows up.
        # Tailwind CSS 3.x pulls in braces/chokidar/fast-glob/micromatch (and postcss-nested,
        # postcss-selector-parser via tailwind's nesting plugin). The only fix offered is the
        # breaking tailwindcss 4.x migration, which is out of scope (layout would break), so
        # these advisories are accepted explicitly:
        #   GHSA-vfj7-8cjw-p6xm  braces (ReDoS, build-time glob only)
        #   GHSA-rj75-hqrm-r3gf  postcss-selector-parser (via postcss-nested, build-time CSS only)
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node -e '
            const allow = new Set(["GHSA-vfj7-8cjw-p6xm", "GHSA-rj75-hqrm-r3gf"]);
            const data = JSON.parse(require("fs").readFileSync("audit.json", "utf8"));
            const bad = [];
            for (const [name, info] of Object.entries(data.vulnerabilities || {})) {
              if (!["high", "critical"].includes(info.severity)) continue;
              const ids = (info.via || [])
                .filter((v) => typeof v === "object")
                .map((v) => (v.url || "").split("/").pop());
              if (ids.some((id) => !allow.has(id))) bad.push(name);
            }
            if (bad.length) {
              console.error("Unallowlisted high/critical vulnerabilities:", bad.join(", "));
              process.exit(1);
            }
            console.log("Only allowlisted advisories present (see workflow comment).");
          '

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck -S error -x install.sh scripts/*.sh

      - name: Shell tests (all scripts/test-*.sh, host calls blocked)
        run: ./scripts/run-shell-tests.sh
